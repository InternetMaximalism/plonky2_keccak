[package]
name = "plonky2_keccak"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
plonky2 = { git = "https://github.com/lita-xyz/Plonky2.git", branch = "wasm", default-features = false }
starky = { git = "https://github.com/lita-xyz/Plonky2.git", package = "starky", branch = "wasm", default-features = false }

hex = "0.4.3"
rand = "0.8.5"
anyhow = "1.0.82"
itertools = "0.12.1"
hashbrown = "0.14.5"
env_logger = "0.11.3"
log = "0.4.21"
tiny-keccak = "2.0.2"
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }

[features]
not-constrain-keccak = []
gpu_merkle = []

